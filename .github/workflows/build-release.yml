name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build macOS app from spec
        run: |
          pyinstaller keithley_suite.spec --noconfirm

      - name: Zip macOS app
        run: |
          cd dist
          zip -qr "../CTWA-macOS.zip" "Calorimetric Thermal Wave Analysis Program.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: CTWA-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Windows exe from spec
        run: |
          pyinstaller keithley_suite.spec --noconfirm

      - name: Zip Windows folder build
        run: |
          Compress-Archive -Path "dist\Calorimetric Thermal Wave Analysis Program" -DestinationPath "CTWA-Windows.zip"

      - name: Resolve installer version from git tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} windows_installer.iss

      - name: Rename installer to canonical filename
        shell: pwsh
        run: |
          $src = "installer_out\CTWA-Setup-${{ steps.ver.outputs.version }}.exe"
          $dst = "CTWA-Windows-Setup.exe"
          Copy-Item $src $dst

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: CTWA-Windows.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: CTWA-Windows-Setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Calorimetric Thermal Wave Analysis Program ${{ github.ref_name }}
          body: |
            ## Calorimetric Thermal Wave Analysis Program ${{ github.ref_name }}

            One program for the Keithley 2450, 6430, 2602B and 2611A — choose the model when you connect.

            ### Downloads
            - **macOS**: `CTWA-macOS.zip` — extract and run the `.app`.
              First launch may need: right-click → Open, or `xattr -dr com.apple.quarantine "Calorimetric Thermal Wave Analysis Program.app"`.
            - **Windows installer (recommended)**: `CTWA-Windows-Setup.exe` — run, optionally create a desktop shortcut.
            - **Windows portable**: `CTWA-Windows.zip` — unzip and run the `.exe` directly, no install.

            Created by Omer Vered with Claude Code.
          files: |
            CTWA-macOS.zip
            CTWA-Windows.zip
            CTWA-Windows-Setup.exe
